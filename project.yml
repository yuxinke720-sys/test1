name: StoryMe
options:
  bundleIdPrefix: com.storyme
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: 1
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
targets:
  StoryMe:
    type: application
    platform: iOS
    sources:
      - path: StoryMeApp.swift
      - path: ContentView.swift
      - path: Views
      - path: ViewModels
      - path: Models
      - path: Services
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.storyme.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Info.plist
